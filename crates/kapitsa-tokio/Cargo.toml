[package]
name = "kapitsa-tokio"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
kapitsa-core = { path = "../kapitsa-core" }
kapitsa-math = { path = "../kapitsa-math" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "collisions"
harness = false

[[bench]]
name = "parallel_step"
harness = false
