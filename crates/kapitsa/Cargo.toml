[package]
name = "kapitsa"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
async = ["dep:rayon", "dep:tokio"]

[dependencies]
kapitsa-core = { path = "../kapitsa-core" }
kapitsa-math = { path = "../kapitsa-math" }
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[test]]
name = "async_marshalling"
required-features = ["async"]

[[test]]
name = "collision_runtime"
required-features = ["async"]

[[test]]
name = "rayon_tokio_spawn"
required-features = ["async"]

[[bench]]
name = "collisions"
harness = false
required-features = ["async"]

[[bench]]
name = "parallel_step"
harness = false
required-features = ["async"]
