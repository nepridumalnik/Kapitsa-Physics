[package]
name = "kapitsa"
description = "Asynchronous simulation runtime and public API for the Kapitsa physics engine. Builds on kapitsa-core and provides the simulation builder, physics client, snapshots, and command queue."
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["physics", "simulation", "gamedev", "space", "rigid-body"]
categories = ["game-development", "simulation"]

[features]
default = []
service = ["dep:tokio", "parallel"]
parallel = ["dep:rayon"]
bench-internals = ["kapitsa-core/bench-internals", "parallel"]

[dependencies]
kapitsa-core.workspace = true
kapitsa-math.workspace = true
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1", optional = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "test-util",
] }

[[test]]
name = "async_marshalling"
required-features = ["service"]

[[test]]
name = "collision_runtime"
required-features = ["service"]

[[test]]
name = "rayon_tokio_spawn"
required-features = ["service"]

[[test]]
name = "client_chunks"
required-features = ["service"]

[[test]]
name = "material_cluster_client"
required-features = ["service"]

[[test]]
name = "chunk_streaming_support"
required-features = ["bench-internals"]

[[example]]
name = "quick_start"
required-features = ["service"]

[[example]]
name = "rocket_flight"
required-features = ["service"]

[[example]]
name = "resilient_host"
required-features = ["service"]

[[bench]]
name = "collisions"
harness = false

[[bench]]
name = "parallel_step"
harness = false
required-features = ["service"]

[[bench]]
name = "large_modular_rocket"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "chunk_streaming"
harness = false
required-features = ["service", "bench-internals"]
