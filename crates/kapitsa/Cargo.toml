[package]
name = "kapitsa"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
kapitsa-core = { path = "../kapitsa-core" }
kapitsa-math = { path = "../kapitsa-math" }
rayon = { version = "1.12.0" }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[test]]
name = "async_marshalling"

[[test]]
name = "collision_runtime"

[[test]]
name = "rayon_tokio_spawn"

[[bench]]
name = "collisions"
harness = false

[[bench]]
name = "parallel_step"
harness = false
