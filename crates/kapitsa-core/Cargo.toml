[package]
name = "kapitsa-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
bench-internals = []

[dependencies]
kapitsa-math = { path = "../kapitsa-math" }

[dev-dependencies]
rstest = "0.28"

[[bench]]
name = "collisions"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_storage"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_interactions"
harness = false
required-features = ["bench-internals"]
