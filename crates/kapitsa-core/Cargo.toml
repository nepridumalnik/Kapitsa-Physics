[package]
name = "kapitsa-core"
description = "Synchronous rigid-body physics core for the Kapitsa engine. Provides the physics world, shapes, colliders, contacts, joints, clusters, and gravity in f64."
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["physics", "simulation", "rigid-body", "collision", "space"]
categories = ["game-development", "simulation"]

[features]
bench-internals = []
bench-detailed-timing = ["bench-internals"]

[dependencies]
kapitsa-math.workspace = true
robust = "1.2.0"

[dev-dependencies]
rayon = "1.12.0"
rstest = "0.28"

[[bench]]
name = "collisions"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_storage"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_interactions"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "joint_stress"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "joint_parallel_scaling"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "colored_solver_scaling"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "aerodynamics"
harness = false

[[bench]]
name = "wing_shielding"
harness = false