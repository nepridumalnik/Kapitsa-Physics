[package]
name = "kapitsa-core"
edition = "2024"
version.workspace = true
license.workspace = true

[features]
bench-internals = []

[dependencies]
kapitsa-math = { path = "../kapitsa-math" }

[dev-dependencies]
rayon = "1.12.0"
rstest = "0.28"

[[bench]]
name = "collisions"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_storage"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collision_interactions"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "joint_stress"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "joint_parallel_scaling"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "colored_solver_scaling"
harness = false
required-features = ["bench-internals"]
